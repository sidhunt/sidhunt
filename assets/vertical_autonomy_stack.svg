<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b10" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#05080c" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="card-tier4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#1c2333" />
    </linearGradient>
    <linearGradient id="card-tier3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#1f2438" />
    </linearGradient>
    <linearGradient id="card-tier2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#192830" />
    </linearGradient>
    <linearGradient id="card-tier1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#2a2218" />
    </linearGradient>

    <!-- Accents -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#7000ff" />
    </linearGradient>
    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ffa3" />
      <stop offset="100%" stop-color="#00b8ff" />
    </linearGradient>
    <linearGradient id="amber-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffb703" />
      <stop offset="100%" stop-color="#fb8500" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.03" />
    </pattern>

    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 24px; fill: #ffffff; letter-spacing: 2px; }
      .subtitle { font-family: "SF Mono", Monaco, Menlo, Consolas, monospace; font-size: 13px; fill: #8b949e; letter-spacing: 1px; }
      .tier-label { font-family: "SF Mono", Monaco, Menlo, Consolas, monospace; font-weight: 700; font-size: 11px; letter-spacing: 1.5px; }
      .tier-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 18px; fill: #f0f6fc; }
      .tier-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #8b949e; }
      .metric-badge { font-family: "SF Mono", Monaco, Menlo, Consolas, monospace; font-weight: 700; font-size: 11px; }
      .connector { stroke: #30363d; stroke-width: 2; stroke-dasharray: 4 4; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="680" rx="16" fill="url(#bg-grad)" />
  <rect width="1200" height="680" rx="16" fill="url(#grid)" />
  <rect width="1198" height="678" x="1" y="1" rx="15" fill="none" stroke="#30363d" stroke-width="1" stroke-opacity="0.6" />

  <!-- Header Section -->
  <g transform="translate(60, 48)">
    <text x="0" y="0" class="title">VERTICAL AUTONOMY STACK</text>
    <text x="0" y="24" class="subtitle">FROM STATIC #![no_std] SILICON TO NEURO-SYMBOLIC COGNITIVE SWARMS</text>
    <rect x="940" y="-18" width="140" height="28" rx="14" fill="#00ffa3" fill-opacity="0.1" stroke="#00ffa3" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="956" cy="-4" r="4" fill="#00ffa3" />
    <text x="968" y="0" font-family="'SF Mono', monospace" font-size="11" font-weight="700" fill="#00ffa3">VERIFIED ON-PREM</text>
  </g>

  <!-- Vertical Connectors -->
  <line x1="600" y1="210" x2="600" y2="235" class="connector" />
  <line x1="600" y1="355" x2="600" y2="380" class="connector" />
  <line x1="600" y1="500" x2="600" y2="525" class="connector" />

  <!-- TIER 4: Cognitive Swarms -->
  <g transform="translate(60, 95)">
    <rect width="1080" height="115" rx="12" fill="url(#card-tier4)" stroke="#7000ff" stroke-width="1.5" stroke-opacity="0.5" />
    <rect x="24" y="20" width="8" height="75" rx="4" fill="url(#cyan-glow)" />
    
    <!-- Content -->
    <text x="48" y="38" class="tier-label" fill="#a371f7">TIER 4 · COGNITIVE DEFENSE &amp; MULTI-DOMAIN SWARMS</text>
    <text x="48" y="64" class="tier-title">Anduril Lattice Cognitive Red-Teaming &amp; Operator Bio-Signals</text>
    <text x="48" y="86" class="tier-desc">Bio-signal grounded operator cognitive load tracking (EEG STEW, pupillometry ds003838) with dynamic CRA agent task offload.</text>

    <!-- Metrics Badges -->
    <g transform="translate(760, 28)">
      <rect width="140" height="30" rx="6" fill="#1f1838" stroke="#a371f7" stroke-width="1" />
      <text x="14" y="19" class="metric-badge" fill="#d2a8ff">EEG STEW / DHI</text>
      <rect x="155" y="0" width="135" height="30" rx="6" fill="#1f1838" stroke="#a371f7" stroke-width="1" />
      <text x="169" y="19" class="metric-badge" fill="#d2a8ff">&gt;50% Hesitation Cut</text>
      <rect y="40" width="290" height="28" rx="6" fill="#121d2f" stroke="#388bfd" stroke-width="1" />
      <text x="14" y="58" class="metric-badge" fill="#79c0ff">Stackelberg Subgame Equilibrium</text>
    </g>
  </g>

  <!-- TIER 3: Autonomous Physics -->
  <g transform="translate(60, 235)">
    <rect width="1080" height="115" rx="12" fill="url(#card-tier3)" stroke="#388bfd" stroke-width="1.5" stroke-opacity="0.5" />
    <rect x="24" y="20" width="8" height="75" rx="4" fill="url(#cyan-glow)" />
    
    <!-- Content -->
    <text x="48" y="38" class="tier-label" fill="#58a6ff">TIER 3 · PREDICTIVE KINEMATICS &amp; SAFETY SHIELDS</text>
    <text x="48" y="64" class="tier-title">Tesla World Model Quad-Shield &amp; Comma.ai TinyPhysics</text>
    <text x="48" y="86" class="tier-desc">Port-Hamiltonian energy envelope with 450ms persistence window; eliminates phantom braking and spinout in OOD corner cases.</text>

    <!-- Metrics Badges -->
    <g transform="translate(760, 28)">
      <rect width="140" height="30" rx="6" fill="#0d2238" stroke="#388bfd" stroke-width="1" />
      <text x="14" y="19" class="metric-badge" fill="#79c0ff">96.29 NAVSIM PDMS</text>
      <rect x="155" y="0" width="135" height="30" rx="6" fill="#0d2238" stroke="#388bfd" stroke-width="1" />
      <text x="169" y="19" class="metric-badge" fill="#79c0ff">-29.55% Lat Cost</text>
      <rect y="40" width="290" height="28" rx="6" fill="#0d2238" stroke="#388bfd" stroke-width="1" />
      <text x="14" y="58" class="metric-badge" fill="#79c0ff">60,000 Paired Monte Carlo Trials</text>
    </g>
  </g>

  <!-- TIER 2: Microkernel -->
  <g transform="translate(60, 375)">
    <rect width="1080" height="115" rx="12" fill="url(#card-tier2)" stroke="#00ffa3" stroke-width="1.5" stroke-opacity="0.5" />
    <rect x="24" y="20" width="8" height="75" rx="4" fill="url(#emerald-glow)" />
    
    <!-- Content -->
    <text x="48" y="38" class="tier-label" fill="#3fb950">TIER 2 · NEURAL-NATIVE DUAL-BAND MICROKERNEL</text>
    <text x="48" y="64" class="tier-title">AetherOS: Hard Realtime Motor Loops Coexisting with Edge AI</text>
    <text x="48" y="86" class="tier-desc">Zero dynamic heap allocation; Band 1 (10 kHz FOC motor control) isolated from Band 2 (chunked INT8 tensor inference).</text>

    <!-- Metrics Badges -->
    <g transform="translate(760, 28)">
      <rect width="140" height="30" rx="6" fill="#0e2a22" stroke="#2ea043" stroke-width="1" />
      <text x="14" y="19" class="metric-badge" fill="#56d364">1,123x Jitter Cut</text>
      <rect x="155" y="0" width="135" height="30" rx="6" fill="#0e2a22" stroke="#2ea043" stroke-width="1" />
      <text x="169" y="19" class="metric-badge" fill="#56d364">125 ns Tensor Yield</text>
      <rect y="40" width="290" height="28" rx="6" fill="#0e2a22" stroke="#2ea043" stroke-width="1" />
      <text x="14" y="58" class="metric-badge" fill="#56d364">0 Breaches / 100,000 Cycles</text>
    </g>
  </g>

  <!-- TIER 1: Silicon Floor -->
  <g transform="translate(60, 515)">
    <rect width="1080" height="115" rx="12" fill="url(#card-tier1)" stroke="#f0883e" stroke-width="1.5" stroke-opacity="0.5" />
    <rect x="24" y="20" width="8" height="75" rx="4" fill="url(#amber-glow)" />
    
    <!-- Content -->
    <text x="48" y="38" class="tier-label" fill="#d29922">TIER 1 · SOVEREIGN HARDWARE &amp; SILICON TARGETS</text>
    <text x="48" y="64" class="tier-title">ARM Cortex-R52 · STM32H7 · On-Prem 24/7 Sovereign Rig</text>
    <text x="48" y="86" class="tier-desc">Deterministic bare-metal execution, Renode cycle-accurate emulation, continuous sovereign CI/CD hardware testing floor.</text>

    <!-- Metrics Badges -->
    <g transform="translate(760, 28)">
      <rect width="140" height="30" rx="6" fill="#2d1c10" stroke="#bd5b00" stroke-width="1" />
      <text x="14" y="19" class="metric-badge" fill="#f0883e">3.22 µs P99.9 Jitter</text>
      <rect x="155" y="0" width="135" height="30" rx="6" fill="#2d1c10" stroke="#bd5b00" stroke-width="1" />
      <text x="169" y="19" class="metric-badge" fill="#f0883e">Rank #1 MLPerf</text>
      <rect y="40" width="290" height="28" rx="6" fill="#2d1c10" stroke="#bd5b00" stroke-width="1" />
      <text x="14" y="58" class="metric-badge" fill="#f0883e">24/7 Zero Cloud Reliance Rig</text>
    </g>
  </g>
</svg>
