pacing:1.5px}.tier-desc,.tier-title{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,sans-serif}.tier-title{font-weight:700;font-size:18px;fill:#f0f6fc}.tier-desc{font-size:13px;fill:#8b949e}.metric-badge{font-family:&quot;SF Mono&quot;,Monaco,Menlo,Consolas,monospace;font-weight:700;font-size:11px}.connector{stroke:#30363d;stroke-width:2;stroke-dasharray:4 4}</style></defs><rect width="1200" height="680" fill="url(#bg-grad)" rx="16"/><rect width="1200" height="680" fill="url(#grid)" rx="16"/><rect width="1198" height="678" x="1" y="1" fill="none" stroke="#30363d" stroke-opacity=".6" stroke-width="1" rx="15"/><g transform="translate(60, 48)"><text x="0" y="0" class="title">VERTICAL AUTONOMY STACK</text><text x="0" y="24" class="subtitle">FROM STATIC #![no_std] SILICON TO NEURO-SYMBOLIC COGNITIVE SWARMS</text><rect width="140" height="28" x="940" y="-18" fill="#00ffa3" fill-opacity=".1" stroke="#00ffa3" stroke-opacity=".4" stroke-width="1" rx="14"/><circle cx="956" cy="-4" r="4" fill="#00ffa3"/><text x="968" y="0" fill="#00ffa3" font-family="'SF Mono', monospace" font-size="11" font-weight="700">VERIFIED ON-PREM</text></g><line x1="600" x2="600" y1="210" y2="235" class="connector"/><line x1="600" x2="600" y1="355" y2="380" class="connector"/><line x1="600" x2="600" y1="500" y2="525" class="connector"/><g transform="translate(60, 95)"><rect width="1080" height="115" fill="url(#card-tier4)" stroke="#7000ff" stroke-opacity=".5" stroke-width="1.5" rx="12"/><rect width="8" height="75" x="24" y="20" fill="url(#cyan-glow)" rx="4"/><text x="48" y="38" fill="#a371f7" class="tier-label">TIER 4 · COGNITIVE DEFENSE &amp; MULTI-DOMAIN SWARMS</text><text x="48" y="64" class="tier-title">Anduril Lattice Cognitive Red-Teaming &amp; Operator Bio-Signals</text><text x="48" y="86" class="tier-desc">Bio-signal grounded operator cognitive load tracking (EEG STEW, pupillometry ds003838) with dynamic CRA agent task offload.</text><g transform="translate(760, 28)"><rect width="140" height="30" fill="#1f1838" stroke="#a371f7" stroke-width="1" rx="6"/><text x="14" y="19" fill="#d2a8ff" class="metric-badge">EEG STEW / DHI</text><rect width="135" height="30" x="155" y="0" fill="#1f1838" stroke="#a371f7" stroke-width="1" rx="6"/><text x="169" y="19" fill="#d2a8ff" class="metric-badge">&gt;50% Hesitation Cut</text><rect width="290" height="28" y="40" fill="#121d2f" stroke="#388bfd" stroke-width="1" rx="6"/><text x="14" y="58" fill="#79c0ff" class="metric-badge">Stackelberg Subgame Equilibrium</text></g></g><g transform="translate(60, 235)"><rect width="1080" height="115" fill="url(#card-tier3)" stroke="#388bfd" stroke-opacity=".5" stroke-width="1.5" rx="12"/><rect width="8" height="75" x="24" y="20" fill="url(#cyan-glow)" rx="4"/><text x="48" y="38" fill="#58a6ff" class="tier-label">TIER 3 · PREDICTIVE KINEMATICS &amp; SAFETY SHIELDS</text><text x="48" y="64" class="tier-title">Tesla World Model Quad-Shield &amp; Comma.ai TinyPhysics</text><text x="48" y="86" class="tier-desc">Port-Hamiltonian energy envelope with 450ms persistence window; eliminates phantom braking and spinout in OOD corner cases.</text><g transform="translate(760, 28)"><rect width="140" height="30" fill="#0d2238" stroke="#388bfd" stroke-width="1" rx="6"/><text x="14" y="19" fill="#79c0ff" class="metric-badge">96.29 NAVSIM PDMS</text><rect width="135" height="30" x="155" y="0" fill="#0d2238" stroke="#388bfd" stroke-width="1" rx="6"/><text x="169" y="19" fill="#79c0ff" class="metric-badge">-29.55% Lat Cost</text><rect width="290" height="28" y="40" fill="#0d2238" stroke="#388bfd" stroke-width="1" rx="6"/><text x="14" y="58" fill="#79c0ff" class="metric-badge">60,000 Paired Monte Carlo Trials</text></g></g><g transform="translate(60, 375)"><rect width="1080" height="115" fill="url(#card-tier2)" stroke="#00ffa3" stroke-opacity=".5" stroke-width="1.5" rx="12"/><rect width="8" height="75" x="24" y="20" fill="url(#emerald-glow)" rx="4"/><text x="48" y="38" fill="#3fb950" class="tier-label">TIER 2 · NEURAL-NATIVE DUAL-BAND MICROKERNEL</text><text x="48" y="64" class="tier-title">AetherOS: Hard Realtime Motor Loops Coexisting with Edge AI</text><text x="48" y="86" class="tier-desc">Zero dynamic heap allocation; Band 1 (10 kHz FOC motor control) isolated from Band 2 (chunked INT8 tensor inference).</text><g transform="translate(760, 28)"><rect width="140" height="30" fill="#0e2a22" stroke="#2ea043" stroke-width="1" rx="6"/><text x="14" y="19" fill="#56d364" class="metric-badge">1,123x Jitter Cut</text><rect width="135" height="30" x="155" y="0" fill="#0e2a22" stroke="#2ea043" stroke-width="1" rx="6"/><text x="169" y="19" fill="#56d364" class="metric-badge">125 ns Tensor Yield</text><rect width="290" height="28" y="40" fill="#0e2a22" stroke="#2ea043" stroke-width="1" rx="6"/><text x="14" y="58" fill="#56d364" class="metric-badge">0 Breaches / 100,000 Cycles</text></g></g><g transform="translate(60, 515)"><rect width="1080" height="115" fill="url(#card-tier1)" stroke="#f0883e" stroke-opacity=".5" stroke-width="1.5" rx="12"/><rect width="8" height="75" x="24" y="20" fill="url(#amber-glow)" rx="4"/><text x="48" y="38" fill="#d29922" class="tier-label">TIER 1 · SOVEREIGN HARDWARE &amp; SILICON TARGETS</text><text x="48" y="64" class="tier-title">ARM Cortex-R52 · STM32H7 · On-Prem 24/7 Sovereign Rig</text><text x="48" y="86" class="tier-desc">Deterministic bare-metal execution, Renode cycle-accurate emulation, continuous sovereign CI/CD hardware testing floor.</text><g transform="translate(760, 28)"><rect width="140" height="30" fill="#2d1c10" stroke="#bd5b00" stroke-width="1" rx="6"/><text x="14" y="19" fill="#f0883e" class="metric-badge">3.22 µs P99.9 Jitter</text><rect width="135" height="30" x="155" y="0" fill="#2d1c10" stroke="#bd5b00" stroke-width="1" rx="6"/><text x="169" y="19" fill="#f0883e" class="metric-badge">Rank #1 MLPerf</text><rect width="290" height="28" y="40" fill="#2d1c10" stroke="#bd5b00" stroke-width="1" rx="6"/><text x="14" y="58" fill="#f0883e" class="metric-badge">24/7 Zero Cloud Reliance Rig</text></g></g></svg>