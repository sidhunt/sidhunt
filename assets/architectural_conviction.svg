<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b10" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#06090d" />
    </linearGradient>

    <!-- Column Gradients -->
    <linearGradient id="card-cloud" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#211517" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="card-sovereign" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#102524" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid2" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.02" />
    </pattern>

    <style>
      .hdr-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; font-size: 22px; fill: #ffffff; letter-spacing: 1.5px; }
      .hdr-sub { font-family: "SF Mono", Monaco, Menlo, Consolas, monospace; font-size: 13px; fill: #8b949e; letter-spacing: 0.5px; }
      .col-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 16px; letter-spacing: 0.5px; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 13px; fill: #f0f6fc; }
      .box-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #8b949e; }
      .stat-num { font-family: "SF Mono", Monaco, Menlo, Consolas, monospace; font-weight: 700; font-size: 14px; }
      .stat-lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #8b949e; }
    </style>
  </defs>

  <rect width="1200" height="520" rx="16" fill="url(#bg-grad2)" />
  <rect width="1200" height="520" rx="16" fill="url(#grid2)" />
  <rect width="1198" height="518" x="1" y="1" rx="15" fill="none" stroke="#30363d" stroke-width="1" stroke-opacity="0.6" />

  <!-- Header -->
  <g transform="translate(60, 44)">
    <text x="0" y="0" class="hdr-title">THE ARCHITECTURAL CONVICTION</text>
    <text x="0" y="24" class="hdr-sub">WHY AUTONOMOUS MACHINES CANNOT BE BUILT ON AN OCEAN OF LEAKY ABSTRACTIONS</text>
  </g>

  <!-- Left Column: The Leaky Cloud Paradigm -->
  <g transform="translate(60, 90)">
    <rect width="525" height="395" rx="12" fill="url(#card-cloud)" stroke="#f85149" stroke-width="1.5" stroke-opacity="0.4" />
    
    <!-- Title Badge -->
    <rect x="24" y="20" width="160" height="26" rx="6" fill="#3c1e21" stroke="#f85149" stroke-width="1" />
    <text x="36" y="37" font-family="'SF Mono', monospace" font-size="11" font-weight="700" fill="#ff7b72">FRAGILE CLOUD STACK</text>
    <text x="24" y="70" class="col-title" fill="#ff7b72">The Ocean of Leaky Abstractions</text>

    <!-- Step 1 -->
    <g transform="translate(24, 90)">
      <rect width="477" height="54" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <circle cx="24" cy="27" r="10" fill="#f85149" fill-opacity="0.2" stroke="#f85149" stroke-width="1" />
      <text x="20" y="31" font-family="'SF Mono', monospace" font-size="11" font-weight="700" fill="#ff7b72">1</text>
      <text x="46" y="24" class="box-title">Remote Cloud Foundation Models over HTTP</text>
      <text x="46" y="42" class="box-desc">Rate limits, TCP connection dropouts, 200ms+ network jitter</text>
    </g>

    <!-- Step 2 -->
    <g transform="translate(24, 154)">
      <rect width="477" height="54" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <circle cx="24" cy="27" r="10" fill="#f85149" fill-opacity="0.2" stroke="#f85149" stroke-width="1" />
      <text x="20" y="31" font-family="'SF Mono', monospace" font-size="11" font-weight="700" fill="#ff7b72">2</text>
      <text x="46" y="24" class="box-title">Heavy General-Purpose OS &amp; Dynamic Allocation</text>
      <text x="46" y="42" class="box-desc">Heap fragmentation, GC pauses, unconstrained P99 tail latency</text>
    </g>

    <!-- Step 3 -->
    <g transform="translate(24, 218)">
      <rect width="477" height="54" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <circle cx="24" cy="27" r="10" fill="#f85149" fill-opacity="0.2" stroke="#f85149" stroke-width="1" />
      <text x="20" y="31" font-family="'SF Mono', monospace" font-size="11" font-weight="700" fill="#ff7b72">3</text>
      <text x="46" y="24" class="box-title">Monolithic 15 ms Matrix Multiplications</text>
      <text x="46" y="42" class="box-desc">Locks CPU; starves hard-deadline motor control loops &amp; sensors</text>
    </g>

    <!-- Failure Metric Banner -->
    <g transform="translate(24, 285)">
      <rect width="477" height="85" rx="8" fill="#2d1316" stroke="#f85149" stroke-width="1" stroke-opacity="0.6" />
      <text x="20" y="28" class="stat-num" fill="#ff7b72">67.8% DEADLINE COLLAPSE</text>
      <text x="20" y="50" class="stat-lbl">Under 10k pps bus flood (Zephyr #75424 baseline): 67,860 breaches out of 100k cycles.</text>
      <text x="20" y="70" class="stat-lbl" fill="#f85149">P99.9 Latency Jitter: 3,622 µs · Catastrophic Actuator Starvation</text>
    </g>
  </g>

  <!-- Right Column: The Sovereign Deterministic Stack -->
  <g transform="translate(615, 90)">
    <rect width="525" height="395" rx="12" fill="url(#card-sovereign)" stroke="#00ffa3" stroke-width="1.5" stroke-opacity="0.4" />
    
    <!-- Title Badge -->
    <rect x="24" y="20" width="175" height="26" rx="6" fill="#123326" stroke="#00ffa3" stroke-width="1" />
    <text x="36" y="37" font-family="'SF Mono', monospace" font-size="11" font-weight="700" fill="#00ffa3">DISSID SOVEREIGN STACK</text>
    <text x="24" y="70" class="col-title" fill="#00ffa3">Deterministic Ground Truth</text>

    <!-- Step 1 -->
    <g transform="translate(24, 90)">
      <rect width="477" height="54" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <circle cx="24" cy="27" r="10" fill="#00ffa3" fill-opacity="0.2" stroke="#00ffa3" stroke-width="1" />
      <text x="20" y="31" font-family="'SF Mono', monospace" font-size="11" font-weight="700" fill="#00ffa3">1</text>
      <text x="46" y="24" class="box-title">On-Prem Bare-Metal &amp; Autonomous Edge Nodes</text>
      <text x="46" y="42" class="box-desc">Zero cloud dependency; semantic routing and edge inference at 26.7 tok/s</text>
    </g>

    <!-- Step 2 -->
    <g transform="translate(24, 154)">
      <rect width="477" height="54" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <circle cx="24" cy="27" r="10" fill="#00ffa3" fill-opacity="0.2" stroke="#00ffa3" stroke-width="1" />
      <text x="20" y="31" font-family="'SF Mono', monospace" font-size="11" font-weight="700" fill="#00ffa3">2</text>
      <text x="46" y="24" class="box-title">AetherOS #![no_std] Dual-Band Microkernel</text>
      <text x="46" y="42" class="box-desc">Zero dynamic heap allocation; Band 1 hard-realtime motor loops strictly isolated</text>
    </g>

    <!-- Step 3 -->
    <g transform="translate(24, 218)">
      <rect width="477" height="54" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <circle cx="24" cy="27" r="10" fill="#00ffa3" fill-opacity="0.2" stroke="#00ffa3" stroke-width="1" />
      <text x="20" y="31" font-family="'SF Mono', monospace" font-size="11" font-weight="700" fill="#00ffa3">3</text>
      <text x="46" y="24" class="box-title">Chunked INT8 Tensors with 125 ns Cooperative Yield</text>
      <text x="46" y="42" class="box-desc">Inference tiles yield to 10 kHz motor loops instantly; eliminates CPU lockup</text>
    </g>

    <!-- Success Metric Banner -->
    <g transform="translate(24, 285)">
      <rect width="477" height="85" rx="8" fill="#0c2b20" stroke="#00ffa3" stroke-width="1" stroke-opacity="0.6" />
      <text x="20" y="28" class="stat-num" fill="#00ffa3">0 DEADLINE BREACHES / 100,000 CYCLES</text>
      <text x="20" y="50" class="stat-lbl">Under 10k pps bus contention flood: 100% hard-realtime compliance.</text>
      <text x="20" y="70" class="stat-lbl" fill="#56d364">P99.9 Latency Jitter: 3.22 µs (1,123x Jitter Reduction) · Mathematical Proof</text>
    </g>
  </g>
</svg>
